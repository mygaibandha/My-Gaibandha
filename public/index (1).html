:root[data-theme=dark]{--g:#7ccf9a;--g2:#a4e0b9;--lg:#1d3326;--ink:#e8f0ea;--mut:#9fb0a4;--bg:#0f1712;--n:#16211a;--line:#26352b;--amb:#f2c35b;--ambbg:#3a2f10;--red:#ff9a8f;--redbg:#3c1815;--card:#141e17;color-scheme:dark}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 "Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--g);outline-offset:2px;border-radius:6px}
.w{max-width:1120px;margin:0 auto;padding:0 16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;color:var(--g)}
nav{display:none;margin-left:auto;gap:4px}
nav a{padding:6px 12px;border-radius:8px;font-weight:500;color:var(--mut)}
nav a:hover{background:var(--lg);color:var(--g)}
.tools{display:flex;gap:8px;margin-left:auto}
nav+.tools{margin-left:8px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--g);background:var(--g);color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--g2)}
.btn.o{background:transparent;color:var(--g)}.btn.o:hover{background:var(--lg)}
.btn.s{min-height:40px;padding:0 12px}
@media(prefers-color-scheme:dark){.btn:not(.o){color:#0f1712}}
:root[data-theme=dark] .btn:not(.o){color:#0f1712}
.demo{background:var(--ambbg);color:var(--amb);font-size:14px;text-align:center;padding:6px 16px}
.hero{background:var(--lg);padding:36px 0 40px}
.hero h1{font-size:clamp(28px,6vw,46px);line-height:1.3;font-weight:700;color:var(--g);max-width:16ch}
.hero p.sub{margin:10px 0 22px;color:var(--mut);max-width:52ch;font-size:17px}
.sr{display:flex;gap:8px;background:var(--card);border:2px solid var(--g);border-radius:14px;padding:6px 6px 6px 14px;align-items:center;max-width:680px}
.sr input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);min-height:44px}
.sr input:focus{outline:0}
.tag{margin-top:12px;color:var(--g);font-weight:600}
section{padding:36px 0}
section.alt{background:var(--n)}
h2{font-size:24px;line-height:1.35;margin-bottom:4px}
.lead{color:var(--mut);margin-bottom:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.grid.c3{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.grid.cats{grid-template-columns:repeat(6,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;transition:border-color .15s,transform .15s}
a.card:hover,button.card:hover{border-color:var(--g);transform:translateY(-2px)}
.cat{display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.cat .ic{width:44px;height:44px;border-radius:12px;background:var(--lg);color:var(--g);display:grid;place-items:center}
.cat b{font-size:16px;line-height:1.3}.cat small{color:var(--mut);line-height:1.4}
.cat[aria-pressed=true]{border-color:var(--g);background:var(--lg)}
.list{display:grid;gap:12px}
@media(min-width:720px){.list{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badge{display:inline-block;font-size:13px;padding:1px 10px;border-radius:99px;background:var(--ambbg);color:var(--amb);font-weight:500;white-space:nowrap}
.badge.ok{background:var(--lg);color:var(--g)}.badge.no{background:var(--redbg);color:var(--red)}
.meta{color:var(--mut);font-size:14px}
.stars{color:var(--amb);display:inline-flex;gap:2px;align-items:center;font-weight:600;font-size:14px}.stars svg{width:15px;height:15px;fill:currentColor}
.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--mut)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:14px}
.em{display:grid;gap:12px}
@media(min-width:720px){.em{grid-template-columns:repeat(3,1fr)}}
.em a{display:flex;gap:12px;align-items:center;background:var(--redbg);border:1px solid transparent;border-radius:14px;padding:14px;color:var(--red)}
.em a:hover{border-color:var(--red)}
.em strong{font-size:28px;line-height:1.1;display:block}
.cta{background:var(--g);color:#fff;border-radius:18px;padding:28px 22px;display:grid;gap:16px}
.cta h2{color:#fff}.cta p{opacity:.9}
.cta .btn{background:#fff;color:var(--g);border-color:#fff}.cta .btn.o{background:transparent;color:#fff}
@media(min-width:720px){.cta{grid-template-columns:1fr auto;align-items:center}}
footer{background:var(--n);border-top:1px solid var(--line);padding:32px 0;color:var(--mut);font-size:15px}
footer .f{display:grid;gap:20px}
@media(min-width:720px){footer .f{grid-template-columns:2fr 1fr 1fr}}
footer h3{color:var(--ink);font-size:16px;margin-bottom:6px}
footer a{display:block;padding:2px 0}footer a:hover{color:var(--g)}
@media(min-width:900px){nav{display:flex}.tools{margin-left:8px}}
@media(max-width:899px){#menu{display:inline-flex}nav.open{display:flex;position:absolute;left:0;right:0;top:64px;background:var(--bg);flex-direction:column;padding:8px 16px 14px;border-bottom:1px solid var(--line)}}
#menu{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
